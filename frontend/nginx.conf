# SPA host + reverse proxy for the Print Service backend.
#
# The Cloudflare tunnel (cloudflared) points at this container:
#     http://printservice-frontend:80
# Everything under /api, /django-admin, /static and /media is proxied to the
# backend service over the internal compose network; everything else is served
# from the React build (with SPA fallback).

# Preserve the scheme that cloudflared reports (X-Forwarded-Proto: https) so
# Django builds https absolute URLs / secure cookies. Falls back to the local
# scheme when the app is reached directly (e.g. host port mapping in dev).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads: MAX_UPLOAD_MB (20 MB) per file plus multipart overhead.
    client_max_body_size 25m;

    # Resolve the backend name at request time via Docker's embedded DNS so
    # nginx starts even if the backend container is still coming up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://printservice-backend:8000";

    # Shared proxy headers for every proxied location.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /api/ {
        proxy_pass $backend;
    }

    location /django-admin/ {
        proxy_pass $backend;
    }

    location /static/ {
        proxy_pass $backend;
    }

    location /media/ {
        proxy_pass $backend;
    }

    # React SPA with client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
